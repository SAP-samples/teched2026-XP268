info:
  name: Fetch User Token
  type: http
  seq: 1

http:
  method: POST
  url: "{{ias_host}}/oauth2/token"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: client_id
        value: "{{client_id}}"
      - name: client_secret
        value: "{{client_secret}}"
      - name: username
        value: "{{username}}"
      - name: password
        value: "{{password}}"
      - name: token_format
        value: jwt
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar('ias_user_token', res.body.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
