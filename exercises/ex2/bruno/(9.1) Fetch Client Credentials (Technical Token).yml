info:
  name: (9.1) Fetch Client Credentials (Technical Token)
  type: http
  seq: 6

http:
  method: POST
  url: "{{ias_host}}/oauth2/token"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: client_credentials
      - name: client_id
        value: "{{client_id}}"
      - name: client_secret
        value: "{{client_secret}}"
      - name: token_format
        value: jwt
      - name: resource
        value: urn:sap:identity:application:provider:name:agent-gateway
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar('ias_technical_token', res.body.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
