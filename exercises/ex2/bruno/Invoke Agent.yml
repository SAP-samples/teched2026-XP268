info:
  name: Invoke Agent
  type: http
  seq: 5

http:
  method: post
  url: "{{agent_gateway_host}}/v1/a2a/{{agent_ord}}/{{agent_tenant}}/jsonrpc"
  headers:
    - name: authorization
      value: Bearer {{agent_gateway_token}}
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": "{{$randomUUID}}",
        "method": "message/send",
        "params": {
          "message": {
            "role": "user",
            "parts": [
              {
                "kind": "text",
                "text": "Tell me on :-)"
              }
            ],
            "messageId": "{{$randomUUID}}",
            "kind": "message"
          },
          "configuration": {
            "blocking": true
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
