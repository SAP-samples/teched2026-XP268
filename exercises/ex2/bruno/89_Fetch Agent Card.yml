info:
  name: Fetch Agent Card
  type: http
  seq: 4

http:
  method: get
  url: "{{agent_gateway_host}}/v1/a2a/{{agent_ord}}/{{agent_tenant}}/.well-known/agent-card.json"
  headers:
    - name: authorization
      value: Bearer {{agent_gateway_token}}
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
